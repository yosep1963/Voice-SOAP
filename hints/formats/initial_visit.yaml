# 초진 외래 포맷 (CC/PI/Past Hx/Family Hx/PE/Imp/Plan)
# 임상 원칙 (Day 2 합의):
# 1) 음주력은 PI와 Past Hx 양쪽에 함께 기재 (현재 진료 맥락 + 과거력 둘 다 의미 있음)
# 2) Imp(추정진단)는 의사가 명시하지 않으면 비움 — 추측·가능성 표현으로 채우지 않음
# 3) Family Hx는 의사가 묻고 환자가 답한 경우만 기재 — 묻지 않은 경우 비움
# 4) 대원칙: 의사의 질문 또는 환자의 대답이 없는 섹션은 default로 비움
id: initial_visit
name: "초진 외래 (CC/PI/Past Hx/Family Hx/PE/Imp/Plan)"
intro: "당신은 간장학 외래 초진 환자의 dictation을 의무기록 형식(CC/PI/Past Hx/Family Hx/PE/Imp/Plan)으로 분류하는 도구입니다."

sections:
  - key: cc
    label: "CC — 주호소"
    short: "CC"
    definition: "환자가 이번에 내원한 주된 이유 (1~2 phrase)"
  - key: pi
    label: "PI — 현병력"
    short: "PI"
    definition: "주호소의 시작 시점·경과·동반 증상. 현재 음주력은 여기에도 기재"
  - key: past_hx
    label: "Past Hx — 과거력"
    short: "PHx"
    definition: "기저질환, 수술력, 약물력, 음주력, 흡연력 (의사가 명시한 것만)"
  - key: family_hx
    label: "Family Hx — 가족력"
    short: "FHx"
    definition: "의사가 묻고 환자가 답한 가족력. 묻지 않은 경우 빈 문자열"
  - key: pe
    label: "PE — 신체검진"
    short: "PE"
    definition: "시진/촉진/타진 소견. 의사가 시행·언급한 것만"
  - key: imp
    label: "Imp — 추정진단"
    short: "Imp"
    definition: "의사가 명시한 잠정 진단. 추측·가능성 표현으로 채우지 말 것 — 명시 없으면 빈 문자열"
  - key: plan
    label: "Plan — 치료계획"
    short: "P"
    definition: "추가 검사, 처방, 추적관찰 계획"

strict_rules:
  - "원문에 없는 의학적 정보를 절대 추가하지 마세요 (특히 약물명, 검사 수치 추측 금지)"
  - "환자 호소, 진찰소견, 검사결과를 발화 그대로 옮기세요"
  - "**의사의 질문 또는 환자의 대답이 없는 섹션은 빈 문자열(\"\")로 두세요. 추측해서 채우지 마세요.**"
  - "음주력은 PI(현재 진료 맥락)와 Past Hx(과거력) 양쪽에 모두 기재하세요"
  - "Imp(추정진단)는 의사가 명시한 경우에만 기재. 'XX 가능성' 같은 hedging은 명시된 것으로 간주"
  - "모호한 표현은 uncertain_segments에 그대로 담으세요"
  - "마크다운 코드블록 없이 JSON만 출력하세요"

few_shots:
  # 예시 1: 알코올성 LC, 음주력이 PI와 Past Hx 양쪽에 들어가는 케이스
  - label: "[예시 1] 알코올성 간경변 의뢰 (음주력 PI + Past Hx 양쪽 기재)"
    input: "55세 남자, 황달과 복부팽만으로 내원. 30년간 매일 소주 2병 음주 지속, 3개월 전부터 식욕부진과 체중감소. 1주일 전 동네 의원에서 간기능 이상 듣고 의뢰됨. 고혈압 5년간 약 복용 중. 가족력 특이사항 없음. 신체검진상 공막 황달, 복부 팽만, 간 종대. 추정 진단은 알코올성 간경변. 복부 CT, 간기능 정밀검사 시행하고 1주일 후 외래 재방문 예정."
    output:
      cc: "황달과 복부팽만"
      pi: "3개월 전부터 식욕부진과 체중감소, 1주일 전 동네 의원에서 간기능 이상 듣고 의뢰됨. 30년간 매일 소주 2병 음주 지속"
      past_hx: "30년간 매일 소주 2병 음주, 고혈압 5년간 약 복용 중"
      family_hx: "특이사항 없음"
      pe: "공막 황달, 복부 팽만, 간 종대"
      imp: "알코올성 간경변"
      plan: "복부 CT, 간기능 정밀검사 시행. 1주일 후 외래 재방문"
      uncertain_segments: []

  # 예시 2: 만성 B형 간염 첫 방문, 가족력 자세히, 음주 없음
  - label: "[예시 2] 만성 B형 간염 보유자 첫 방문 (Family Hx 명시, 음주 없음)"
    input: "42세 여자, B형 간염 보유자로 본원 처음 방문. 5년 전 검진에서 진단되어 동네에서 정기 검사 중. 음주는 안 함, 흡연 없음. 아버지가 50대에 간암으로 사망, 언니도 B형 간염 보유. 현재 무증상. 신체검진상 특이사항 없음. 잠정 진단은 만성 B형 간염. 복부 초음파, HBV DNA, AFP 검사 후 1개월 후 재방문."
    output:
      cc: "B형 간염 보유자, 본원 첫 방문"
      pi: "5년 전 검진에서 B형 간염 진단되어 동네에서 정기 검사 중. 현재 무증상. 음주 없음"
      past_hx: "B형 간염 5년, 음주 없음, 흡연 없음"
      family_hx: "아버지 50대 간암 사망, 언니 B형 간염 보유"
      pe: "특이사항 없음"
      imp: "만성 B형 간염"
      plan: "복부 초음파, HBV DNA, AFP 검사. 1개월 후 재방문"
      uncertain_segments: []

  # 예시 3: 검사결과만 들고 온 case, 가족력 안 묻고 Imp 명시 안 됨
  - label: "[예시 3] 검진 ALT 이상 의뢰 (Family Hx·Imp 비움 — 묻지/말하지 않음)"
    input: "35세 여자, 건강검진에서 ALT 65 발견되어 내원. 무증상이고 음주는 거의 안 함. 신체검진상 특이사항 없음. 추가 검사 후 다시 보겠음."
    output:
      cc: "건강검진 ALT 65 발견"
      pi: "무증상. 음주는 거의 안 함"
      past_hx: "음주 거의 안 함"
      family_hx: ""
      pe: "특이사항 없음"
      imp: ""
      plan: "추가 검사 후 재방문"
      uncertain_segments: []

  # 예시 4: HCC 의심, 모든 섹션 차 있음 ("가능성"은 명시된 추정으로 간주)
  - label: "[예시 4] HCC 의심 (Imp에 'XX 가능성' 형태 명시 허용)"
    input: "70세 남자, 1개월 전부터 체중감소 5kg, 우상복부 통증으로 내원. C형 간염 20년 전 진단, 인터페론 치료 받았으나 SVR 도달 못함. 음주는 사회적으로 가끔. 어머니 간경변으로 사망. 신체검진상 우상복부 압통, 간 종대. 추정 진단은 HCC 가능성. 복부 dynamic CT, AFP, PIVKA 검사 후 1주일 후 재방문."
    output:
      cc: "체중감소, 우상복부 통증"
      pi: "1개월 전부터 체중감소 5kg, 우상복부 통증. 음주는 사회적으로 가끔"
      past_hx: "C형 간염 20년 (인터페론 치료, SVR 미도달), 사회적 음주"
      family_hx: "어머니 간경변 사망"
      pe: "우상복부 압통, 간 종대"
      imp: "HCC 가능성"
      plan: "복부 dynamic CT, AFP, PIVKA 검사. 1주일 후 재방문"
      uncertain_segments: []

  # 예시 5: PE 비어 있고 Imp 비어 있는 case (의사가 진단 보류, 다수 섹션 빔)
  - label: "[예시 5] 지방간 정밀검사 의뢰 (PE·Imp·past_hx 일부 비움)"
    input: "50세 여자, 다른 병원에서 지방간 진단받고 정밀 검사 위해 의뢰됨. 비만 외 특이 증상 없음. 가족력 특이사항 없음. 본원에서 검사 위해 내원했으니 신체검진은 다음에. 간 fibroscan, 혈액검사, 복부 초음파 시행 후 결과 나오면 재방문 예정."
    output:
      cc: "지방간 정밀 검사 의뢰"
      pi: "비만 외 특이 증상 없음"
      past_hx: "비만, 지방간"
      family_hx: "특이사항 없음"
      pe: ""
      imp: ""
      plan: "간 fibroscan, 혈액검사, 복부 초음파 시행. 결과 나오면 재방문"
      uncertain_segments: []
