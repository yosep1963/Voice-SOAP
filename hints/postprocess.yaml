# STT 후처리 사전 — Whisper의 알려진 오인식을 LLM 호출 전에 보정
#
# 형식: pattern (정규식), replace (치환 문자열), category (분류)
# 원칙: 다른 발화에서 의도치 않은 치환을 만들 가능성이 있는 룰은 추가하지 않는다.
#       (예: "의협"→"우엽"은 의사협회 등 다른 의미와 충돌하므로 제외 — LLM의 [?] 표시에 의존)
#
# 우선순위: 약물명(category=drug)이 가장 위험 (잘못된 약물 처방 위험), 검사명/진단명 다음.

# === 약물명: 가장 위험. 유사 약물과의 혼동 방지가 핵심 ===

# 푸로세미드(Furosemide). 토르세미드(Torsemide)와 다른 약물이므로 LLM이 추측하지 않도록 사전 차단.
- pattern: "표로세미드|퓨로스마이드|푸로스마이드|풀로세미드"
  replace: "푸로세미드"
  category: drug

# 엔테카비르(Entecavir) — B형 간염 1차 치료제
- pattern: "엔드카벨|엔드카베르|엔트카비르"
  replace: "엔테카비르"
  category: drug

# 프로프라놀롤(Propranolol) — 정맥류 출혈 예방
- pattern: "프로프로노|프로프라노|프로프라놀"
  replace: "프로프라놀롤"
  category: drug

# 리팍시민(Rifaximin) — 간성뇌증 치료
- pattern: "디팍시민|리팩시민|디팩시민"
  replace: "리팍시민"
  category: drug

# 스피로노락톤(Spironolactone) — 복수 조절
- pattern: "스피르녹톤|스페르농턴|스피르농턴|스피로녹톤"
  replace: "스피로노락톤"
  category: drug

# 락툴로오스(Lactulose) — 간성뇌증 치료
- pattern: "락틀로즈|락툴로즈|락툴로오즈"
  replace: "락툴로오스"
  category: drug

# 베바시주맙(Bevacizumab) — HCC 면역항암제 병용
- pattern: "베퍼시즈맙|베버시즈맙|베바시즈맙"
  replace: "베바시주맙"
  category: drug

# 아테졸리주맙(Atezolizumab) — HCC 면역항암제
- pattern: "아테졸리즈맙|아테솔리주맙|아테솔리즈맙"
  replace: "아테졸리주맙"
  category: drug

# === 검사 / 수치 ===

# 총 빌리루빈 (Whisper의 다양한 변형: 미를/비를/비/빌이/빌루)
- pattern: "청미를루빈|총미를루빈|총비를루빈|청비루빈|총비루빈|청빌루빈|총빌이루빈"
  replace: "총 빌리루빈"
  category: lab

# ALT (Whisper가 영문 알파벳을 한글로 잘못 푸는 경우 - 'E'가 'A'로)
# \b는 한글-숫자 사이에서 동작 안 하므로 boundary 사용 안 함. ELT 단어가 의학 dictation에 다른 의미로 쓰이는 경우는 사실상 없음.
- pattern: "ELT(?=\\d|\\s|,|\\.|$)"
  replace: "ALT"
  category: lab

# HBV DNA (Whisper가 알파벳을 붙여 적는 경우)
- pattern: "HVDNA|HBVDNA|HBV-DNA"
  replace: "HBV DNA"
  category: lab

# AST/ALT 수치 사이 공백 정리: "AST85" → "AST 85"
- pattern: "(AST|ALT|ALP|GGT|INR|AFP)(\\d)"
  replace: "\\1 \\2"
  category: format

# === 해부학적 위치 ===

# 우엽(right lobe). 의협/의에오/우에오 같은 일반어 충돌 변형은 컨텍스트로 잡기 어려워서
# "우엽" 발음에서 흔히 깨지는 패턴(우에오, 우에)을 한정적으로 매칭.
# "에"가 위치격 조사라 "우에" 같은 짧은 매칭은 위험 — "우엽에 발견" 류 phrase에서만 잡히게 boundary 강화.
- pattern: "우에오에|우에오"
  replace: "우엽"
  category: anatomy

# 좌엽(left lobe) — 대칭으로 추가
- pattern: "자에오에|자에오|좌에오"
  replace: "좌엽"
  category: anatomy

# === 진단명 ===

# 간성뇌증(Hepatic Encephalopathy)
- pattern: "간성온수|간성온뇌|간성뇌수"
  replace: "간성뇌증"
  category: diagnosis

# === 점수 체계 / 표기 일관성 ===

# Child-Pugh 표기 통일. "차일드 후" / "Childhood" 모두 외래 dictation에서 관찰됨.
# "Childhood"는 영어 일반어이므로 "Class"가 따라오는 의학 컨텍스트 한정.
- pattern: "차일드푸는|차일드푸|차일드 푸|차일드퓨|차일드 후|차일드후"
  replace: "Child-Pugh"
  category: score
- pattern: "[Cc]hildhood(?=\\s*[Cc]lass)"
  replace: "Child-Pugh"
  category: score

# MELD 표기 통일. "메리트"는 일반어이므로 "점수" 후속 한정.
- pattern: "멜드점수|멜드 점수|멜드|메리트점수|메리트 점수"
  replace: "MELD 점수"
  category: score

# === 일반 표현 정리 ===

# 흔한 띄어쓰기 오류
- pattern: "간경변추적중|간경변추적 중"
  replace: "간경변 추적 중"
  category: format

# === 외래 dictation 회귀 (2026-04-30) ===
# 59세 남자/HCC 환자 dictation에서 발견된 오인식 패턴들.

# 알코올성 — Whisper가 "알코올성"을 "알코올슨"으로 끝맺음. "슨"은 한국어 종결어미가 아님.
- pattern: "알코올슨"
  replace: "알코올성"
  category: format

# 간경변(LC) — "간경변"이 "광기인변"으로 풀리는 변형. "광기인변" 자체가 어휘적으로 무의미.
- pattern: "광기인변|광기 인변"
  replace: "간경변"
  category: diagnosis

# 간경변 — "간격면" 변형. "간격"은 일반어("CT 간격" 등)지만 "간격면" 단위는 어휘적 무의미.
- pattern: "간격면"
  replace: "간경변"
  category: diagnosis

# 간경변 — "간경면" / "간경면증" 변형. Whisper가 "변"을 "면"으로 흘려 듣는 패턴.
# "?"로 "증" suffix 선택적 매칭 (간경면도 간경면증도 모두 간경변으로).
- pattern: "간경면증?"
  replace: "간경변"
  category: diagnosis

# 간세포암(HCC) — "간세파암" 변형. "세파"는 인명 가능성 있으나 "간세파암" 단위는 dictation 한정.
- pattern: "간세파암|간 세파암"
  replace: "간세포암"
  category: diagnosis

# 간초음파 — "간총파" / "간청파" / "간종파" 변형. "총파"·"청파"·"종파" 단위는 어휘적으로 등장 X.
- pattern: "간총파|간청파|간종파"
  replace: "간초음파"
  category: exam

# Liver dynamic CT — Whisper가 한글/영어 양쪽으로 다양하게 풂.
# 한글: "리바/리버 다이너믹 시티". 영어: "Viva/Liva Dynamic CT". 멀티워드라 충돌 가능성 낮음.
- pattern: "(?:리바|리버|[VL]iva)\\s*(?:다이너믹|[Dd]ynamic)\\s*(?:시티|CT)"
  replace: "Liver dynamic CT"
  category: exam

# 우엽(right lobe) — "간 위협" 변형. "위협"은 일반어이므로 "간 위협" + 위치격 "에" 한정.
# (해부학적 위치 섹션의 기존 "우에오" 룰과 보완 관계)
- pattern: "간\\s*위협(?=에)"
  replace: "간 우엽"
  category: anatomy

# TACE — Whisper가 "TACE"를 "TAC" 또는 "TEC"로 풂. 한국어 조사·후속 명사 한정.
# 다른 의미의 TAC/TEC 약어와 충돌 위험 — 새 변형 발견 시 lookahead 좁힐 것.
- pattern: "(?:TAC|TEC)(?=[를을시계])"
  replace: "TACE"
  category: procedure

# === 외래 dictation 회귀 (2026-05-06) ===
# 19 케이스 분석(reports/edit_analysis_2026-05-06) 결과 신규 도출 룰들.

# --- 약물명 ---

# 이뇨제(diuretics, 일반 명사) — Whisper가 "이뇨"를 "인유"로 흘려듣는 변형.
- pattern: "인유자|인유제|이뇨자"
  replace: "이뇨제"
  category: drug

# 테르리프레신(terlipressin) — 정맥류 출혈 시 vasoconstrictor.
# Whisper가 "Tully Fresh"/"Tully Free" 등 영어 일반어로 흘려 풂. 의학 외 등장 X.
- pattern: "Tully\\s*Fres?h?|Tully\\s*Free"
  replace: "terlipressin"
  category: drug

# --- 검사 / 수치 ---

# 빌리루빈(Bilirubin) — "총 빌리루빈" 룰과 별개로 "빌리루빈" 단독 변형.
- pattern: "비료루빈|비루리빈"
  replace: "빌리루빈"
  category: lab

# 헤모글로빈(Hemoglobin) — "헤모글루빈" 단순 음운 오류.
- pattern: "헤모글루빈"
  replace: "헤모글로빈"
  category: lab

# AST/ALT 묶음 표기 — "ASD-LT"/"ASDLT" 변형. ASD(Atrial Septal Defect)와 충돌 회피 위해
# 'LT' 단어 종결 강제 — 뒤에 영문자가 안 와야 매칭 (단독 'ASD'는 'LT' 없으니 매칭 안 됨).
- pattern: "ASD-?LT(?![A-Za-z])"
  replace: "AST/ALT"
  category: lab

# --- 형식 정리 ---

# "증가되어"의 단순 음운 오류. "증거되어"는 한국어 동사로 등장 X.
- pattern: "증거되어"
  replace: "증가되어"
  category: format

# --- 해부학적 위치 ---

# Intrahepatic duct — 한글 음역 "인트라파틱 덕트" 변형.
- pattern: "인트라파틱\\s*덕트"
  replace: "intrahepatic duct"
  category: anatomy

# --- 점수 체계 ---

# Child-Pugh — "차일드 훅" 변형. 기존 "차일드후" 등 룰의 보완.
- pattern: "차일드\\s*훅"
  replace: "Child-Pugh"
  category: score

# Pugh A/B/C — "훅 A" 등 단독 변형. 위 차일드훅 룰 적용 후에도 단독 "훅 A"가 남는 케이스 보호.
# Child-Pugh 룰이 먼저 매칭되도록 yaml 순서 유지.
- pattern: "훅\\s*([A-C])"
  replace: "Pugh \\1"
  category: score

# 간경변 중증도 — "간경변 경도" 변형. "경도"는 형용사라 "간경변 + 경도" 어순 자체 부자연.
- pattern: "간경변\\s*경도"
  replace: "간경변 중증도"
  category: score

# --- 진단명 ---

# B형 간염 — Whisper가 "B형"을 "비"로 풀거나 "비형/비시" 변형.
- pattern: "비영관염|비시간념|비시간염|비형간염"
  replace: "B형간염"
  category: diagnosis

# C형 간염 — 위와 대칭.
- pattern: "시영관염|시시간념|시시간염|시형간염"
  replace: "C형간염"
  category: diagnosis

# Ascites — 한글 음역 변형.
- pattern: "아사히티스|아사이티스|아스사이티스"
  replace: "ascites"
  category: diagnosis

# Cirrhosis — 한글 음역 변형.
- pattern: "료시스|시로시스"
  replace: "cirrhosis"
  category: diagnosis

# Refractory — 한글 음역.
- pattern: "리플렉트리"
  replace: "refractory"
  category: diagnosis

# --- 증상 / 소견 ---

# 복부팽만 — 단순 음운 오류 변형.
- pattern: "복부평만|부품행만|복부팽반"
  replace: "복부팽만"
  category: symptom

# 소견이 보 — "소균이 보" 변형. "소균"은 의학 외 단어 X.
- pattern: "소균이\\s*보"
  replace: "소견이 보"
  category: finding

# Multiple liver mass — 한글 음역.
- pattern: "멀티풀\\s*리버\\s*메스"
  replace: "multiple liver mass"
  category: finding

# Distension — 한글 음역.
- pattern: "디스텐[데테]이션"
  replace: "distension"
  category: finding

# Exposed vessel — "Boto"는 의학 외 영어로 등장 X.
- pattern: "Exposed?\\s*Boto|Exposure\\s*Boto"
  replace: "exposed vessel"
  category: finding

# --- 검사 ---

# Admission panel — 한글 음역 변형.
- pattern: "어드밍션\\s*판넬|어드미션\\s*판넬"
  replace: "Admission panel"
  category: exam

# 시행한 — "철령한" 변형. "철령"은 의학 외 사용 X.
- pattern: "철령한"
  replace: "시행한"
  category: exam

# === 추가 검토 후 보류 (2026-05-06) ===
# 다음 패턴은 위양성 위험으로 추가하지 않음:
#   "엄청이었|엄청났음" → "음성이었음": "엄청"은 일반 부사, 의학 외 발화에서 빈번. LLM 컨텍스트 보정에 의존.
#   "출혈\s*진단(?=은|이)" → "추정 진단": "출혈 진단"은 정당한 임상 표현(변정맥류 등) → 의미 변경 위험.
# 향후 분석에서 같은 패턴이 빈번하게 나오면 컨텍스트 좁힌 뒤 재검토.
