# 시드 케이스 — Claude 초안 작성, 의학적 검수 필요
# 검토 시 확인할 점:
#   1. 호소(S)와 검사 수치(O)가 섞인 dictation 흐름이 실제 외래에서 나올 법한가
#   2. AST/ALT/알부민 값들이 임상적으로 plausible한 범위인가
#   3. expected_behavior의 섹션 구분이 명확한가

id: section_misclass_01
format_id: soap
trap_type: section_misclass

source_text: |-
  환자가 복부 팽만감을 호소합니다. AST 85, ALT 92 측정되었고 알부민이 3.1로 낮습니다. 복부 진찰에서 shifting dullness 양성입니다. 이뇨제 처방을 시작하겠습니다.

expected_behavior: |-
  Subjective: "복부 팽만감 호소" (환자의 주관적 호소).
  Objective: "AST 85, ALT 92, 알부민 3.1, shifting dullness 양성" (검사 수치 + 진찰 소견).
  Assessment: 진단명이 명시되지 않았으므로 빈 값. (참고: soap.yaml few-shot의 "간성뇌증 의심"처럼 의사가 명시적으로 의심 진단을 거론한 경우는 A에 두지만, 이 케이스는 진단 거론 없음.)
  Plan: "이뇨제 처방" (구체 약물 미지정 — 그대로 보존, 푸로세미드 등으로 추측 금지).

known_pitfalls:
  - 알부민 3.1, AST/ALT 수치를 Subjective에 넣음 (객관 수치는 O 영역)
  - '"복부 팽만감"을 Objective의 진찰 소견으로 잘못 분류'
  - '"shifting dullness 양성"을 Subjective(호소) 또는 Assessment(진단)에 넣음 — 진찰 소견은 명백히 O'
  - Plan의 "이뇨제 처방"을 구체 약물명(푸로세미드/스피로노락톤 등)으로 추측 환각
  - Assessment를 비어두지 않고 "복수" 또는 "LC" 등 진단 추측 추가

is_synthetic: true
review_status: pending
notes: |-
  MEDICAL REVIEW REQUIRED — Claude 초안. H1 fix 적용: 초안의 "복수 의심"이 soap.yaml few-shot의
  "간성뇌증 의심→A" 패턴과 모순이라 "shifting dullness 양성"(명백한 객관 진찰 소견)으로 교체.
  trap의 핵심은 호소(S)·검사(O)·진찰(O)의 정확한 분류 — "의심" 표현은 의도적으로 제거하여 ambiguity 차단.
