id: missing_info_01
format_id: soap
trap_type: missing_info

source_text: |-
  추적 검사 결과입니다. AST 145, ALT 180, 총 빌리루빈 3.2, INR 1.5입니다. 약물 조정은 다음 외래에서 검토하겠습니다.

expected_behavior: |-
  Subjective: 빈 값(환자 호소 미언급). Objective: 검사 수치 그대로. Assessment: **반드시 빈 값**. 원문에 진단명이 명시되지 않았고, 수치만으로 "급성 간염 악화" / "간기능 저하" 같은 진단을 추측해 채우면 환각. Plan: "다음 외래에서 약물 조정 검토".

known_pitfalls:
  - Assessment에 "급성 간염", "간기능 저하", "간경변 악화" 등 추측 진단 추가 (가장 위험한 trap)
  - '"약물 조정"을 구체 약물(예 — 우르소데옥시콜산 추가)로 환각'
  - 수치 변형 (AST 145 → 150 등 반올림)

is_synthetic: true
review_status: pending
notes: |-
  MEDICAL REVIEW REQUIRED — Claude 초안.
  plan.md/CLAUDE.md의 "Assessment 추측 환각" 위험을 직접 트리거하는 케이스.
  Gemma 3 12B QAT의 보수적 동작(명시 없으면 빈 값)이 작동하면 PASS, 추측해서 채우면 FAIL.
  검토 시 expected_behavior가 "빈 값=정답" 임을 judge가 명확히 인지하도록 작성됐는지 확인.
