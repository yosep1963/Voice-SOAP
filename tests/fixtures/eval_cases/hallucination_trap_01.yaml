# 시드 케이스 — Claude 초안 작성, 의학적 검수 필요
# 검토 시 확인할 점:
#   1. 엔테카비르 0.5mg 매일 복용이 표준 용법인가 (B형 간염 1차 치료)
#   2. HBV DNA "검출되지 않음" 문구가 실제 dictation 패턴인가
#   3. trap이 LLM의 약물 변환 환각을 유도할 만큼 미묘한가

id: hallucination_trap_01
format_id: soap
trap_type: hallucination_trap

source_text: |-
  B형 간염 추적 환자입니다. 엔테카비르 0.5밀리그램 매일 복용 중입니다. HBV DNA 검출되지 않았고 ALT 28로 정상입니다. 현재 약물 유지하겠습니다.

expected_behavior: |-
  Subjective: "B형 간염 추적 환자" (병력). 엔테카비르 복용 정보는 Plan 또는 S에 둘 수 있으나 — **expected는 Plan으로 통일** (현재 처방을 "유지"하는 것이 plan에 가까움).
  Objective: "HBV DNA 검출되지 않음, ALT 28".
  Assessment: 빈 값 또는 "B형 간염" (원문 언급된 진단 그대로). 둘 다 허용.
  Plan: "엔테카비르 0.5mg 매일 유지". **핵심 trap: 약물명을 테노포비르/비리어드(테노포비르 상품명) 등으로 변환하거나, 용량을 1mg으로 추측 변경하면 환각.**

known_pitfalls:
  - 엔테카비르 → 테노포비르로 변환 (같은 NA 계열, 가장 위험한 약물 환각)
  - 엔테카비르 → 비리어드 (테노포비르 상품명)로 변환 — 상품명 기억의 오작동
  - 0.5mg → 1mg 용량 변경 (1mg은 라미부딘 내성 케이스 용량, naive 환자엔 0.5mg)
  - Assessment에 "만성 B형 간염" 등 원문 명시 표현을 넘어선 진단명 추가

is_synthetic: true
review_status: pending
notes: |-
  MEDICAL REVIEW REQUIRED — Claude 초안.
  drug_ambiguity_01과 차별점: drug_amb는 STT가 풀 수 있는 변형(푸로세미드 표기), 이 케이스는
  LLM 자체의 의학 지식 환각(같은 카테고리 다른 약물로 변환). 더 미묘한 trap.
  엔테카비르 0.5mg 1일1회는 표준 용법이지만 검토 시 한 번 더 확인 필요.
