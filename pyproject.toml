[project]
name = "voice-soap"
version = "0.1.0"
description = "Korean voice → SOAP medical record assistant (local-only)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "mlx-whisper>=0.4",
    "numpy>=1.26",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "respx>=0.21",
]

[tool.pytest.ini_options]
markers = [
    "integration: tests that load the Whisper model (slow, manual)",
]
testpaths = ["tests"]
